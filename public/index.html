<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আগমনী — Agomoni</title>
<meta name="description" content="Durga Puja 2026 route planner for Kolkata and Bengaluru — optimised pandal-hopping routes, Pujo Match recommendations and live crowd reports.">
<meta name="theme-color" content="#3A0709">
<meta property="og:title" content="আগমনী — Agomoni">
<meta property="og:image" content="img/hero.jpg">
<meta property="og:description" content="অ্যালগরিদমে সাজানো পুজোর রুট, রুচি মিলিয়ে মণ্ডপ, লাইভ ভিড় — কলকাতা ও বেঙ্গালুরু।">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233A0709'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='32' cy='20' rx='6' ry='11'/%3E%3Cellipse cx='32' cy='20' rx='6' ry='11' transform='rotate(72 32 32)'/%3E%3Cellipse cx='32' cy='20' rx='6' ry='11' transform='rotate(144 32 32)'/%3E%3Cellipse cx='32' cy='20' rx='6' ry='11' transform='rotate(216 32 32)'/%3E%3Cellipse cx='32' cy='20' rx='6' ry='11' transform='rotate(288 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23E8741C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Galada&display=swap" rel="stylesheet">
<!--LEAFLET_CSS--><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><!--/LEAFLET_CSS-->
<link rel="preload" as="image" href="img/hero.jpg" fetchpriority="high">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0112 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.4 18H15a3 3 0 000-6H9a3 3 0 010-6h6.6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></symbol>
  <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 01-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
</svg>

<header class="top">
  <a class="brand" href="#home" aria-label="home">
    <span class="wordmark" data-t="brand"></span>
    <small data-t="brandSub"></small>
  </a>
  <div class="switches">
    <div class="seg" role="group" aria-label="city">
      <button type="button" data-city="kolkata" data-t="city_kolkata"></button>
      <button type="button" data-city="bengaluru" data-t="city_bengaluru"></button>
    </div>
    <button type="button" class="lang" id="langBtn" aria-label="language">EN</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a href="#home"    data-view="home"><svg><use href="#i-home"/></svg><span data-t="nav_home"></span></a>
  <a href="#pandals" data-view="pandals"><svg><use href="#i-list"/></svg><span data-t="nav_pandals"></span></a>
  <a href="#map"     data-view="map"><svg><use href="#i-map"/></svg><span data-t="nav_map"></span></a>
  <a href="#route"   data-view="route"><svg><use href="#i-route"/></svg><span data-t="nav_route"></span><em id="routeCount" hidden></em></a>
  <a href="#match"   data-view="match"><svg><use href="#i-spark"/></svg><span data-t="nav_match"></span></a>
  <a href="#food"    data-view="food" class="wide-only"><svg><use href="#i-bowl"/></svg><span data-t="nav_food"></span></a>
  <a href="#about"   data-view="about" class="wide-only"><svg><use href="#i-info"/></svg><span data-t="nav_about"></span></a>
</nav>

<!-- HOME HERO (full-bleed) -->
<section id="v-home" class="view">
  <div class="dawn">
    <img class="dawn-photo" src="img/hero.jpg" alt="" fetchpriority="high" decoding="async">
    <canvas id="shiuli" aria-hidden="true"></canvas>
    <div class="dawn-inner">
      <p class="eyebrow"><span id="heroCity"></span> · <span id="heroYear"></span></p>
      <h1 class="hero-word" data-t="brand"></h1>
      <p class="hero-line" data-t="hero_title"></p>
      <p class="hero-sub" data-t="hero_sub"></p>
      <div class="ctas">
        <a class="btn primary" href="#route" data-t="cta_route"></a>
        <a class="btn on-dark" href="#match" data-t="cta_match"></a>
      </div>
      <div class="countdown" id="countdown"></div>
    </div>
  </div>
  <div class="wrap home-body">
    <div class="feats">
      <a class="feat" href="#route"><svg><use href="#i-route"/></svg><h3 data-t="feat1_t"></h3><p data-t="feat1_d"></p></a>
      <a class="feat" href="#match"><svg><use href="#i-spark"/></svg><h3 data-t="feat2_t"></h3><p data-t="feat2_d"></p></a>
      <a class="feat" href="#pandals"><svg><use href="#i-map"/></svg><h3 data-t="feat3_t"></h3><p data-t="feat3_d"></p></a>
    </div>
    <div class="moments">
      <h2 data-t="moments_title"></h2>
      <div class="moment-row" id="moments"></div>
    </div>
    <div class="schedule">
      <h2 data-t="schedule"></h2>
      <ol id="schedule"></ol>
      <p class="fine" data-t="schedule_note"></p>
    </div>
    <div class="mobile-links">
      <a href="#food" class="btn ghost" data-t="nav_food"></a>
      <a href="#about" class="btn ghost" data-t="nav_about"></a>
    </div>
  </div>
</section>

<main class="wrap">
  <section id="v-pandals" class="view">
    <div class="toolbar">
      <label class="sr" for="q">search</label>
      <input id="q" type="search" autocomplete="off">
      <label class="sr" for="sort">sort</label>
      <select id="sort">
        <option value="name" data-t="sort_name"></option>
        <option value="crowd" data-t="sort_crowd"></option>
        <option value="near" data-t="sort_near"></option>
      </select>
    </div>
    <div class="chips" id="zoneChips"></div>
    <div class="chips" id="typeChips"></div>
    <p class="count" id="pCount"></p>
    <div class="grid" id="pandalGrid"></div>
  </section>

  <section id="v-map" class="view">
    <div id="map"></div>
    <div id="mapInfo"></div>
    <p class="fine legend" id="legend"></p>
  </section>

  <section id="v-route" class="view">
    <h2 data-t="route_title"></h2>
    <div id="routeBuilder"></div>
    <div id="routeResult"></div>
  </section>

  <section id="v-match" class="view">
    <h2 data-t="match_title"></h2>
    <p class="lede" data-t="match_sub"></p>
    <form id="matchForm"></form>
    <div id="matchResult"></div>
  </section>

  <section id="v-food" class="view">
    <div class="food-hero">
      <img src="img/food-hero.jpg" alt="" loading="lazy" decoding="async">
      <div><h2 data-t="food_title"></h2><p data-t="food_sub"></p></div>
    </div>
    <div class="toolbar"><label class="sr" for="foodNear">near</label><select id="foodNear" class="wide-select"></select></div>
    <div id="foodList" class="fgrid"></div>
  </section>

  <section id="v-about" class="view">
    <h2 data-t="about_title"></h2>
    <div id="aboutBody" class="prose"></div>
  </section>
</main>

<footer class="foot">
  <span class="wordmark small" data-t="brand"></span>
  <p><span data-t="footer_made"></span> <a id="ghLink" target="_blank" rel="noopener"></a></p>
  <p class="fine" data-t="footer_data"></p>
</footer>

<dialog id="reportDlg">
  <form method="dialog">
    <h3 data-t="rep_title"></h3>
    <p id="repName" class="fine"></p>
    <div class="levels" id="repLevels"></div>
    <p id="repMsg" class="fine" role="status"></p>
    <button class="btn ghost" value="cancel" data-t="cancel"></button>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/photos.js" defer></script>
<script src="js/engine.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
